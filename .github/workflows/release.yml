name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          bash package-app.sh
          bash make-dmg.sh
      - name: Zip and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP=$(ls -d dist/*.app)
          BASE=$(basename "$APP")
          ditto -c -k --keepParent "$APP" "$BASE.zip"
          DMG=$(ls dist/*.dmg)
          gh release upload "$GITHUB_REF_NAME" "$BASE.zip" "$DMG" --clobber || gh release create "$GITHUB_REF_NAME" "$BASE.zip" "$DMG" --title "${GITHUB_REF_NAME#v}" --generate-notes
